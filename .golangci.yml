version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet          # go vet (shadowed vars, printf mismatches, etc.)
    - errcheck       # unchecked errors
    - staticcheck    # staticcheck suite (SA*, ST*, QF*, S*)
    - ineffassign    # assignments with no effect
    - unused         # unexported symbols that are never used

    # Style
    - misspell       # common English misspellings

    # Security
    - gosec          # G-code security rules (hardcoded credentials, path traversal, etc.)

    # Bugs
    - bodyclose      # HTTP response body must be closed
    - noctx          # HTTP requests must carry context
    - copyloopvar    # loop variable capture bugs

    # Maintainability
    - godot          # comments must end in a period
    - nolintlint     # nolint directives must be specific and justified
  settings:
    govet:
      enable:
        - copylocks
    errcheck:
      check-type-assertions: true
      check-blank: false  # `_ = expr` is intentional in tests
    godot:
      scope: declarations
      capital: false
    # scan-fix(gosec:G304,G204): documented, repo-wide exclude for a systemic
    # false-positive pattern in this codebase (6 findings across 4 files as of
    # the lint-debt cleanup PR) rather than scattering inline #nosec comments:
    #   - G304 (potential file inclusion via variable) fires on every
    #     os.ReadFile/os.Create call whose path is a variable. Every instance
    #     here is either an operator-supplied CLI flag (--output-file,
    #     --baseline, --write-baseline, rule-dir paths) — the same trust level
    #     as any CLI accepting a local file path — or a path produced by
    #     walking a directory this process itself created via os.MkdirTemp and
    #     git-cloned (internal/hcl/walker.go), which also skips symlinks so it
    #     can't be tricked into reading files outside that temp dir. None of
    #     these paths ever originate from untrusted network/remote input.
    #   - G204 (subprocess launched with variable) fires on both
    #     exec.CommandContext(ctx, gitPath, args...) call sites in
    #     internal/scanner/terraform.go. gitPath comes from exec.LookPath("git")
    #     and args is an internally-built argv slice — never a shell string
    #     (no `sh -c`), so there is no shell-interpolation / command-injection
    #     vector for gosec to actually be flagging.
    gosec:
      excludes:
        - G304
        - G204
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck, gosec]
      - path: "vendor/"
        linters: [all]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ffreis

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
