name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mod-tidy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25"
      working-directory: "."

  fmt:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25"
      working-directory: "."

  lint:
    needs: [fmt]
    # scan-fix(ci:startup_failure): go-lint.yml's job needs pull-requests:read
    # (for golangci-lint-action's PR lookup) in addition to contents:read — the
    # caller must grant at least what the called reusable workflow's job
    # declares, or GitHub rejects the whole run at parse time with
    # startup_failure (zero jobs, "workflow file issue"), not a job failure.
    permissions:
      contents: read
      pull-requests: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25"
      working-directory: "."

  test:
    if: ${{ !github.event.pull_request.draft }}
    needs: [fmt]
    # scan-fix(ci:startup_failure): go-test.yml's job needs id-token:write (L2
    # S3 build-cache OIDC, added in the v1.3.0 pin bump — no-op at runtime
    # since go-cache-s3 defaults false, but GitHub validates the permission
    # contract statically) in addition to contents:read — an under-grant here
    # rejects the WHOLE run at parse time (zero jobs, generic "workflow file
    # issue"), same failure mode already documented on the lint job above.
    permissions:
      contents: read
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25"
      working-directory: "."
